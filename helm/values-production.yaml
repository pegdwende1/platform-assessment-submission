# Production environment overrides
image:
  tag: "latest"

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilization: 70

rollout:
  strategy: canary
  steps:
    - setWeight: 10
    - pause: { duration: 60s }
    - setWeight: 30
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 120s }
    - setWeight: 100
  analysis:
    enabled: true
    interval: 30s
    failureLimit: 3
    successCondition: "result[0] < 0.05"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
