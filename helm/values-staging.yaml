# Staging environment overrides
image:
  tag: "62f8872dd99f065d3c428d3103b11300e51897c2"

replicaCount: 1

autoscaling:
  enabled: false

rollout:
  strategy: canary
  steps:
    - setWeight: 50
    - pause: { duration: 10s }
    - setWeight: 100
  analysis:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
