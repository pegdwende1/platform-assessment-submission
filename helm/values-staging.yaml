# Staging environment overrides
image:
  tag: "ea2744846669ae941ec4309fcfd90d3e064e6a04"

replicaCount: 1

autoscaling:
  enabled: false

rollout:
  strategy: canary
  steps:
    - setWeight: 50
    - pause: { duration: 10s }
    - setWeight: 100
  analysis:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
