# Default values for cicd-demo
replicaCount: 2

image:
  repository: ghcr.io/bernadin/cicd-demo
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

healthCheck:
  path: /healthz
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

rollout:
  strategy: canary
  steps:
    - setWeight: 10
    - pause: { duration: 30s }
    - setWeight: 30
    - pause: { duration: 30s }
    - setWeight: 50
    - pause: { duration: 60s }
    - setWeight: 100
  analysis:
    enabled: true
    interval: 30s
    failureLimit: 3
    successCondition: "result[0] < 0.05"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
