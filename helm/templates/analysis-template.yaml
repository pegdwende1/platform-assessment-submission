{{- if .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Chart.Name }}-success-rate
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: {{ .Values.rollout.analysis.interval }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: "{{ .Values.rollout.analysis.successCondition }}"
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{service="{{`{{args.service-name}}`}}",status!~"5.*"}[2m]))
            /
            sum(rate(http_requests_total{service="{{`{{args.service-name}}`}}"}[2m]))
{{- end }}
