name: Manual Promote to Production

# This workflow is for promoting a specific image tag to production
# outside the normal CI flow (e.g., hotfix, re-promotion after rollback).
# The standard path is through the CI pipeline with environment gates.

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to promote (commit SHA)'
        required: true
        type: string
      skip-verification:
        description: 'Skip image signature verification (emergency only)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  # ═══════════════════════════════════════════════
  # STAGE 1: Verify Image Signature
  # ═══════════════════════════════════════════════
  verify-signature:
    name: "Verify Image Signature (Cosign)"
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-verification }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature
        run: |
          echo "🔐 Verifying signature for image tag: ${{ inputs.image-tag }}"

          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}

          echo "✅ Image signature verified successfully"

  # ═══════════════════════════════════════════════
  # STAGE 2: Pre-promotion Validation
  # ═══════════════════════════════════════════════
  validate:
    name: "Pre-promotion Checks"
    runs-on: ubuntu-latest
    needs: verify-signature
    if: always() && (needs.verify-signature.result == 'success' || inputs.skip-verification)
    steps:
      - uses: actions/checkout@v4

      - name: Verify image exists in registry
        run: |
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}
          echo "✅ Image exists in registry"

      - name: Check image was deployed to staging
        run: |
          STAGING_TAG=$(grep 'tag:' helm/values-staging.yaml | awk '{print $2}' | tr -d '"')
          if [ "$STAGING_TAG" != "${{ inputs.image-tag }}" ]; then
            echo "::warning::Image ${{ inputs.image-tag }} is not currently deployed in staging (staging has: $STAGING_TAG)"
            echo "⚠️ Promoting an image that may not have been validated in staging" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Image matches current staging deployment"
          fi

  # ═══════════════════════════════════════════════
  # STAGE 3: Promote to Production (Gated)
  # ═══════════════════════════════════════════════
  promote:
    name: "Promote Image to Production"
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://app.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Update production image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ inputs.image-tag }}\"|" helm/values-production.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values-production.yaml
          git commit -m "chore(production): promote image ${{ inputs.image-tag }}

          Promoted by: ${{ github.actor }}
          Signature verified: ${{ !inputs.skip-verification }}
          Source: manual promotion workflow"
          git push

  # ═══════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════
  summary:
    name: "Promotion Summary"
    runs-on: ubuntu-latest
    needs: [verify-signature, validate, promote]
    if: always()
    steps:
      - name: Generate promotion summary
        run: |
          echo "# 🎯 Manual Production Promotion Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ inputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Promoted by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signature Verified | ${{ needs.verify-signature.result == 'success' && '✅ Yes' || inputs.skip-verification && '⚠️ Skipped (emergency)' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-checks | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Promotion | ${{ needs.promote.result == 'success' && '✅ Complete' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Next Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. ArgoCD will detect the change and show the application as **OutOfSync**" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Trigger **Sync** in ArgoCD UI to begin canary rollout" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Argo Rollouts will execute: 10% → 30% → 50% → 100%" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Monitor Grafana dashboards during each rollout step" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🔄 Rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **During canary:** Abort in Argo Rollouts dashboard → instant traffic shift back to stable" >> "$GITHUB_STEP_SUMMARY"
          echo "- **After full rollout:** \`git revert\` on the promotion commit, or click Rollback in ArgoCD" >> "$GITHUB_STEP_SUMMARY"
