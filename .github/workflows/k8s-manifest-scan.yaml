name: Kubernetes Manifest & Policy Validation

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'kyverno/**'
      - 'argocd/**'
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - 'kyverno/**'
      - 'argocd/**'

jobs:
  # ═══════════════════════════════════════════════
  # STAGE 1: Helm Lint & Template Validation
  # ═══════════════════════════════════════════════
  helm-lint:
    name: "Helm Lint & Template"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: helm lint helm/

      - name: Template with staging values
        run: |
          helm template cicd-demo helm/ \
            -f helm/values.yaml \
            -f helm/values-staging.yaml \
            --output-dir rendered/staging

      - name: Template with production values
        run: |
          helm template cicd-demo helm/ \
            -f helm/values.yaml \
            -f helm/values-production.yaml \
            --output-dir rendered/production

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/
          retention-days: 5

  # ═══════════════════════════════════════════════
  # STAGE 2: Kubernetes Schema Validation (kubeconform)
  # ═══════════════════════════════════════════════
  schema-validation:
    name: "K8s Schema Validation"
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@v4

      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin

      - name: Validate staging manifests
        run: |
          echo "### Validating staging manifests..." 
          find rendered/staging -name '*.yaml' -exec kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            {} +

      - name: Validate production manifests
        run: |
          echo "### Validating production manifests..."
          find rendered/production -name '*.yaml' -exec kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            {} +

  # ═══════════════════════════════════════════════
  # STAGE 3: Kyverno Policy Validation
  # ═══════════════════════════════════════════════
  kyverno-policy-check:
    name: "Kyverno Policy Validation"
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@v4

      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/

      - name: Install Kyverno CLI
        run: |
          curl -sL https://github.com/kyverno/kyverno/releases/latest/download/kyverno-cli_linux_x86_64.tar.gz | \
            tar xz -C /usr/local/bin kyverno

      - name: Validate policies syntax
        run: |
          kyverno validate policy kyverno/policies/ --output-format table

      - name: Test staging manifests against policies
        run: |
          echo "### Testing staging manifests against Kyverno policies..."
          kyverno apply kyverno/policies/ \
            --resource rendered/staging/ \
            --output-format table \
            --detailed-results

      - name: Test production manifests against policies
        run: |
          echo "### Testing production manifests against Kyverno policies..."
          kyverno apply kyverno/policies/ \
            --resource rendered/production/ \
            --output-format table \
            --detailed-results

  # ═══════════════════════════════════════════════
  # STAGE 4: Security Scanning (kubesec + Checkov)
  # ═══════════════════════════════════════════════
  security-scan:
    name: "Manifest Security Scan"
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@v4

      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: rendered/production
          framework: kubernetes
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false
          quiet: true

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: "checkov-k8s"

  # ═══════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════
  summary:
    name: "Manifest Validation Summary"
    runs-on: ubuntu-latest
    needs: [helm-lint, schema-validation, kyverno-policy-check, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 📋 Kubernetes Manifest Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Helm Lint & Template | ${{ needs.helm-lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| K8s Schema Validation (kubeconform) | ${{ needs.schema-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kyverno Policy Validation | ${{ needs.kyverno-policy-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan (Checkov) | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Policies Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- No \`latest\` image tags allowed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource requests and limits required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Read-only root filesystem enforced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Non-root containers required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Liveness and readiness probes required" >> "$GITHUB_STEP_SUMMARY"
          echo "- No privilege escalation allowed" >> "$GITHUB_STEP_SUMMARY"
