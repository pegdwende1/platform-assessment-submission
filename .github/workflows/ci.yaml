name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.22'

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════
  # STAGE 1: Lint & Unit Test
  # ═══════════════════════════════════════════════
  test:
    name: "Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run linter (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: app
        continue-on-error: true

      - name: Run unit tests with coverage
        working-directory: app
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.out
          retention-days: 14

  # ═══════════════════════════════════════════════
  # STAGE 2: Static Application Security Testing (SAST)
  # ═══════════════════════════════════════════════
  sast:
    name: "SAST - CodeQL & Semgrep"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Build for CodeQL analysis
        working-directory: app
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/owasp-top-ten
            p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ═══════════════════════════════════════════════
  # STAGE 3: Software Composition Analysis (SCA)
  # ═══════════════════════════════════════════════
  sca:
    name: "SCA - Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Govulncheck (Go vulnerability database)
        working-directory: app
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... | tee govulncheck-results.txt

      - name: Run Trivy filesystem scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          format: 'sarif'
          output: 'trivy-sca-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy SCA results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-sca-results.sarif
          category: "trivy-sca"

  # ═══════════════════════════════════════════════
  # STAGE 4: Build, Sign & Scan Container Image
  # ═══════════════════════════════════════════════
  build:
    name: "Build, Sign & Scan Image"
    runs-on: ubuntu-latest
    needs: [test, sast, sca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    outputs:
      image-tag: ${{ github.sha }}
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            --annotations "repo=${{ github.repository }}" \
            --annotations "sha=${{ github.sha }}" \
            --annotations "run_id=${{ github.run_id }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy image scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: "trivy-image"

  # ═══════════════════════════════════════════════
  # STAGE 5: Generate SBOM & Submit to Dependency-Track
  # ═══════════════════════════════════════════════
  sbom:
    name: "SBOM Generation & Dependency-Track Analysis"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM with Syft (CycloneDX format)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          artifact-name: sbom-cyclonedx

      - name: Upload SBOM to Dependency-Track
        if: env.DTRACK_URL != ''
        env:
          DTRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: "cicd-demo"
          PROJECT_VERSION: ${{ github.sha }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${DTRACK_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -H "Content-Type: multipart/form-data" \
            -F "projectName=${PROJECT_NAME}" \
            -F "projectVersion=${PROJECT_VERSION}" \
            -F "autoCreate=true" \
            -F "bom=@sbom-cyclonedx.json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to upload SBOM to Dependency-Track (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

          echo "✅ SBOM uploaded to Dependency-Track"
          echo "Token: $BODY"

      - name: Wait for Dependency-Track analysis
        if: env.DTRACK_URL != ''
        env:
          DTRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: "cicd-demo"
          PROJECT_VERSION: ${{ github.sha }}
        run: |
          echo "⏳ Waiting for Dependency-Track to complete analysis..."
          sleep 30

          PROJECT_UUID=$(curl -s \
            "${DTRACK_URL}/api/v1/project/lookup?name=${PROJECT_NAME}&version=${PROJECT_VERSION}" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" | jq -r '.uuid')

          if [ "$PROJECT_UUID" = "null" ] || [ -z "$PROJECT_UUID" ]; then
            echo "::error::Could not find project in Dependency-Track"
            exit 1
          fi

          METRICS=$(curl -s \
            "${DTRACK_URL}/api/v1/metrics/project/${PROJECT_UUID}/current" \
            -H "X-Api-Key: ${DTRACK_API_KEY}")

          CRITICAL=$(echo "$METRICS" | jq -r '.critical // 0')
          HIGH=$(echo "$METRICS" | jq -r '.high // 0')
          MEDIUM=$(echo "$METRICS" | jq -r '.medium // 0')
          LOW=$(echo "$METRICS" | jq -r '.low // 0')
          COMPONENTS=$(echo "$METRICS" | jq -r '.components // 0')
          POLICY_VIOLATIONS=$(echo "$METRICS" | jq -r '.policyViolationsTotal // 0')

          echo "## 🛡️ Dependency-Track Analysis Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Components Analyzed | ${COMPONENTS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟠 High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 Medium | ${MEDIUM} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 Low | ${LOW} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy Violations | ${POLICY_VIOLATIONS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📋 [View full report](${DTRACK_URL}/projects/${PROJECT_UUID})" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Dependency-Track found ${CRITICAL} critical vulnerabilities"
            exit 1
          fi

          echo "✅ Dependency-Track analysis passed (no critical vulnerabilities)"

  # ═══════════════════════════════════════════════
  # STAGE 6: Deploy to Staging (Requires Approval)
  # ═══════════════════════════════════════════════
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update staging image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" helm/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values-staging.yaml
          git commit -m "chore(staging): deploy image ${{ github.sha }}

          Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          Signed: yes (cosign/sigstore)
          SBOM: uploaded to Dependency-Track
          Scan: Trivy + Grype passed
          Approved by: environment protection rule"
          git push

      - name: Post staging deployment summary
        run: |
          echo "## 🚀 Staging Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | **staging** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Digest | \`${{ needs.build.outputs.image-digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signed | ✅ Cosign (keyless) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD will auto-sync staging within ~3 minutes." >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════
  # STAGE 7: Promote to Production (Requires Approval)
  # ═══════════════════════════════════════════════
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production
      url: https://app.example.com
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull latest changes (staging commit was just pushed)
          ref: main

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature before production deploy
        run: |
          echo "🔐 Verifying image signature before production promotion..."

          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

          echo "✅ Image signature verified"

      - name: Update production image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" helm/values-production.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values-production.yaml
          git commit -m "chore(production): promote image ${{ github.sha }}

          Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          Signature: verified (cosign)
          Promoted from: staging
          Approved by: environment protection rule"
          git push

      - name: Post production deployment summary
        run: |
          echo "## 🎯 Production Promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | **production** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Digest | \`${{ needs.build.outputs.image-digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signature Verified | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollout Strategy | Canary (10% → 30% → 50% → 100%) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "1. ArgoCD will show app as **OutOfSync**" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Trigger **Sync** in ArgoCD UI to begin canary rollout" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Monitor Grafana dashboards during rollout steps" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════
  summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [test, sast, sca, build, sbom, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Generate pipeline summary
        run: |
          echo "# 🚀 CI/CD Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Pipeline Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint & Test | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SAST (CodeQL + Semgrep) | ${{ needs.sast.result == 'success' && '✅ Passed' || needs.sast.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SCA (Trivy + Govulncheck) | ${{ needs.sca.result == 'success' && '✅ Passed' || needs.sca.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build, Sign & Scan Image | ${{ needs.build.result == 'success' && '✅ Passed' || needs.build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM & Dependency-Track | ${{ needs.sbom.result == 'success' && '✅ Passed' || needs.sbom.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy Staging (gated) | ${{ needs.deploy-staging.result == 'success' && '✅ Deployed' || needs.deploy-staging.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy Production (gated) | ${{ needs.deploy-production.result == 'success' && '✅ Deployed' || needs.deploy-production.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Artifact Details" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ needs.build.outputs.image-digest || 'N/A' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signed:** ✅ Cosign (keyless / Sigstore)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SBOM:** CycloneDX (uploaded to Dependency-Track)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Environment Promotion Flow" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Build → [Approval Gate] → Staging → [Approval Gate] → Production" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
