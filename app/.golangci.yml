run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    # Allow unused parameters in handler functions (http.Request often unused in simple handlers)
    - linters:
        - unused
      source: "func.*http\\.Request"
