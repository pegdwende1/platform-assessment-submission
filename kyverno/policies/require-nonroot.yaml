apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-nonroot
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must run as non-root users. Running as root inside a container
      increases the risk of container breakout and host compromise.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - Rollout
      validate:
        message: "Containers must set runAsNonRoot to true."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
    - name: require-readonly-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - Rollout
      validate:
        message: "Containers must use a read-only root filesystem."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
