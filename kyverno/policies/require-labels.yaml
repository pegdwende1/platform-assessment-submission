apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Standard Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      All workloads must include standard Kubernetes labels for
      identification, ownership tracking, and observability.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - Rollout
                - Service
      validate:
        message: "The label 'app' is required on all resources."
        pattern:
          metadata:
            labels:
              app: "?*"
