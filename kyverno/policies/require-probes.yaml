apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Liveness and Readiness Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Liveness and readiness probes are required for all production workloads
      to ensure Kubernetes can properly manage pod lifecycle and traffic routing.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-liveness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - Rollout
      validate:
        message: "A liveness probe is required for all containers."
        pattern:
          spec:
            containers:
              - livenessProbe:
                  httpGet:
                    path: "?*"
                    port: "?*"
    - name: require-readiness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - Rollout
      validate:
        message: "A readiness probe is required for all containers."
        pattern:
          spec:
            containers:
              - readinessProbe:
                  httpGet:
                    path: "?*"
                    port: "?*"
